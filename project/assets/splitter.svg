<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <rect width="100" height="100" fill="#2d3436" rx="10"/>
  <rect x="10" y="10" width="80" height="80" fill="#f39c12" rx="5"/>
  <!-- Central hub -->
  <rect x="35" y="35" width="30" height="30" fill="#2c3e50" rx="3"/>
  <!-- Input from LEFT, output UP and DOWN -->
  <path d="M20 50 L35 50" stroke="#ecf0f1" stroke-width="6" fill="none"/>
  <!-- UP arrow -->
  <path d="M50 35 L50 20 M50 20 L40 30 M50 20 L60 30" stroke="#ecf0f1" stroke-width="6" fill="none"/>
  <!-- DOWN arrow -->
  <path d="M50 65 L50 80 M50 80 L40 70 M50 80 L60 70" stroke="#ecf0f1" stroke-width="6" fill="none"/>
</svg>
